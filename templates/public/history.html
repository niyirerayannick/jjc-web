{% extends 'base.html' %}
{% block content %}
{% include 'public/partials/content_hero.html' %}
<section class="py-16"><div class="max-w-4xl mx-auto px-6"><div class="prose-jjc">{{ content_page.body|safe }}</div></div></section>
<section class="py-16 bg-offwhite"><div class="max-w-5xl mx-auto px-6"><h2 class="text-3xl font-serif font-bold text-navy mb-10">Milestones</h2><div class="space-y-6">{% for item in milestones %}<article class="bg-white rounded-xl p-6 shadow-sm border-l-4 border-gold"><div class="text-gold font-bold text-xl">{{ item.year }}</div><h3 class="text-xl font-bold text-navy mt-1">{{ item.title }}</h3><p class="text-gray-600 mt-2">{{ item.description }}</p></article>{% endfor %}</div></div></section>
{% endblock %}
