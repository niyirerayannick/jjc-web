{% extends 'dashboard/base.html' %}{% block dashboard_content %}<section class="bg-white rounded-xl shadow-sm p-6"><div class="flex justify-between mb-5"><h2 class="text-xl font-bold text-navy">Homepage Hero Slides</h2><a class="text-blue-primary font-semibold" href="{% url 'dashboard:slider-create' %}">New slide</a></div>{% for slide in slides %}<a class="flex justify-between gap-4 py-3 border-t hover:text-blue-primary" href="{% url 'dashboard:slider-edit' slide.pk %}"><span><strong>{{ slide.order }}.</strong> {{ slide.title }}</span><span>{% if slide.is_active %}Active{% else %}Inactive{% endif %}</span></a>{% endfor %}</section>{% endblock %}
